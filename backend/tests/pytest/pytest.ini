[pytest]
# Configuração de testes pytest para BiotecPredict

# Diretórios de testes
testpaths = 
    unit
    integration
    repositories
    database
    error_handling
    health

# Padrão de arquivos de teste
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Opções adicionais
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Modo assíncrono
asyncio_mode = auto

# Markers customizados
markers =
    unit: Unit tests (sem dependências externas)
    integration: Integration tests (múltiplos componentes)
    repositories: Repository tests (acesso a dados)
    database: Database tests (configuração e operações)
    error_handling: Error handling tests (exceções)
    health: Health check tests (status da aplicação)
    slow: Slow tests (executar com -m "not slow")
    skip: Skip test
    xfail: Expected to fail

# Configuração de cobertura
[coverage:run]
source = backend
omit = 
    */tests/*
    */migrations/*
    */__init__.py
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Mínimo de cobertura
fail_under = 70
