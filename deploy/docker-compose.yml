name: biotecpredict

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: biotecpredict-backend
    ports:
      - "8000:8000"
    volumes:
      # Bind mount (não volume nomeado): o banco fica em backend/data/Biotecpredict.db
      # no host, um arquivo real e acessível fora do Docker (ex: DB Browser for SQLite),
      # no mesmo caminho usado por padrão quando o backend roda localmente sem Docker.
      - ../backend/data:/app/data
      - biotecpredict_models:/app/backend/ml/models
    environment:
      - DATABASE_URL=sqlite:///./data/Biotecpredict.db
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - biotecpredict-net

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: biotecpredict-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - biotecpredict-net

volumes:
  biotecpredict_models:

networks:
  biotecpredict-net:
    driver: bridge
