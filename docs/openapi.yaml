openapi: 3.0.3
info:
  title: BiotecPredict API
  description: |
    API para monitoramento de processos biotecnológicos com predição de riscos via ML.

    Permite upload de dados de sensores via CSV, análise de compliance GMP,
    predição de risco (LOW_RISK / MEDIUM_RISK / HIGH_RISK) e consulta de leituras por batch.
  version: 1.0.0
  contact:
    name: Michele Oliveira
    email: dr.micheleluanaa@gmail.com

servers:
  - url: http://localhost:8000
    description: Desenvolvimento local

tags:
  - name: batches
    description: Gerenciamento de batches e upload de CSV
  - name: compliance
    description: Manufacturing Compliance Score (GMP)
  - name: prediction
    description: Predição de risco via ML (Random Forest)

paths:

  # ── Batches ──────────────────────────────────────────────────────────────────

  /api/v1/upload:
    post:
      tags: [batches]
      summary: Upload de arquivo CSV com dados de sensores
      description: |
        Processa o arquivo através do pipeline:
        1. Parse CSV
        2. Validação de ranges
        3. Limpeza de dados
        4. Persistência no banco
      operationId: uploadCsv
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo CSV com colunas temperature, ph, dissolved_oxygen, pressure, agitator_speed
      responses:
        "200":
          description: Batch criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
              example:
                id: 1
                upload_date: "2026-06-07T14:00:00"
                status: COMPLETED
                compliance_score: 87.5
                risk_prediction: LOW_RISK
        "400":
          description: Arquivo inválido ou dados fora dos ranges esperados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "500":
          description: Erro interno ao processar o arquivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/batches:
    get:
      tags: [batches]
      summary: Listar todos os batches
      operationId: listBatches
      parameters:
        - name: skip
          in: query
          description: Número de registros a pular
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          description: Número máximo de registros retornados
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Lista de batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchResponse"

  /api/v1/batch/{batch_id}:
    get:
      tags: [batches]
      summary: Obter detalhes de um batch
      operationId: getBatch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Detalhes do batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "404":
          description: Batch não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Compliance ────────────────────────────────────────────────────────────────

  /api/v1/compliance/{batch_id}:
    get:
      tags: [compliance]
      summary: Calcular Manufacturing Compliance Score de um batch
      operationId: getComplianceScore
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Compliance score calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceResponse"
              example:
                batch_id: 1
                compliance_score: 87.5
                classification: ACCEPTABLE
                sensor_metrics:
                  temperature:
                    mean: 25.3
                    std: 0.8
                    in_range_pct: 98.0
                  ph:
                    mean: 7.1
                    std: 0.2
                    in_range_pct: 100.0
        "404":
          description: Batch ou leituras não encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/batch/{batch_id}/sensors:
    get:
      tags: [compliance]
      summary: Obter todas as leituras de sensores de um batch
      operationId: getBatchSensors
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Leituras de sensores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorReadingsResponse"
        "404":
          description: Batch não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Prediction ────────────────────────────────────────────────────────────────

  /api/v1/prediction/{batch_id}:
    get:
      tags: [prediction]
      summary: Predição de risco para um batch existente
      operationId: getRiskPrediction
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Predição calculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResponse"
              example:
                batch_id: 1
                risk_prediction: LOW_RISK
                confidence_score: 0.92
                interpretation: "Processo dentro dos parâmetros normais"
                recommendations:
                  - "Manter parâmetros atuais"
                  - "Monitoramento padrão a cada 30 minutos"
        "404":
          description: Batch ou leituras não encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/predict:
    post:
      tags: [prediction]
      summary: Predição de risco para dados de sensores ad-hoc
      operationId: predictRisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorInput"
            example:
              temperature: 25.0
              ph: 7.0
              dissolved_oxygen: 85.0
              pressure: 5.0
              agitator_speed: 250
      responses:
        "200":
          description: Predição calculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResult"

  /api/v1/model/info:
    get:
      tags: [prediction]
      summary: Informações sobre o modelo de ML
      operationId: getModelInfo
      responses:
        "200":
          description: Metadados do modelo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelInfo"
              example:
                model_type: RandomForestClassifier
                n_estimators: 200
                features:
                  - temperature
                  - ph
                  - dissolved_oxygen
                  - pressure
                  - agitator_speed
                risk_classes:
                  - LOW_RISK
                  - MEDIUM_RISK
                  - HIGH_RISK
                feature_importance:
                  temperature: 0.28
                  ph: 0.24
                  dissolved_oxygen: 0.22
                  pressure: 0.15
                  agitator_speed: 0.11

# ── Components ────────────────────────────────────────────────────────────────

components:

  parameters:
    BatchId:
      name: batch_id
      in: path
      required: true
      description: ID do batch
      schema:
        type: integer
        example: 1

  schemas:

    BatchResponse:
      type: object
      required: [id, upload_date, status]
      properties:
        id:
          type: integer
          description: Identificador único do batch
        upload_date:
          type: string
          format: date-time
          description: Data/hora do upload
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        compliance_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          nullable: true
          description: Score de compliance GMP (0–100)
        risk_prediction:
          type: string
          enum: [LOW_RISK, MEDIUM_RISK, HIGH_RISK]
          nullable: true

    SensorInput:
      type: object
      required: [temperature, ph, dissolved_oxygen, pressure, agitator_speed]
      properties:
        temperature:
          type: number
          format: float
          description: "Temperatura em °C"
          example: 25.0
        ph:
          type: number
          format: float
          description: pH (0–14)
          example: 7.0
        dissolved_oxygen:
          type: number
          format: float
          description: Oxigênio dissolvido em %
          example: 85.0
        pressure:
          type: number
          format: float
          description: Pressão em bar
          example: 5.0
        agitator_speed:
          type: number
          format: float
          description: Velocidade do agitador em RPM
          example: 250

    SensorReading:
      allOf:
        - $ref: "#/components/schemas/SensorInput"
        - type: object
          properties:
            id:
              type: integer
            recorded_at:
              type: string
              format: date-time
              nullable: true

    SensorReadingsResponse:
      type: object
      properties:
        batch_id:
          type: integer
        count:
          type: integer
        readings:
          type: array
          items:
            $ref: "#/components/schemas/SensorReading"

    SensorMetric:
      type: object
      properties:
        mean:
          type: number
          format: float
        std:
          type: number
          format: float
        in_range_pct:
          type: number
          format: float
          description: Percentual de leituras dentro do range GMP

    ComplianceResponse:
      type: object
      properties:
        batch_id:
          type: integer
        compliance_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        classification:
          type: string
          enum: [ACCEPTABLE, WARNING, CRITICAL]
        sensor_metrics:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SensorMetric"

    PredictionResult:
      type: object
      properties:
        risk_prediction:
          type: string
          enum: [LOW_RISK, MEDIUM_RISK, HIGH_RISK]
        confidence_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        interpretation:
          type: string
        recommendations:
          type: array
          items:
            type: string

    PredictionResponse:
      allOf:
        - type: object
          properties:
            batch_id:
              type: integer
        - $ref: "#/components/schemas/PredictionResult"

    ModelInfo:
      type: object
      properties:
        model_type:
          type: string
        n_estimators:
          type: integer
        features:
          type: array
          items:
            type: string
        risk_classes:
          type: array
          items:
            type: string
        feature_importance:
          type: object
          additionalProperties:
            type: number
            format: float

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Mensagem de erro
