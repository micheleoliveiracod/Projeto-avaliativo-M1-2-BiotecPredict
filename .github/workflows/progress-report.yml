name: Relatório de Progresso

on:
  schedule:
    - cron: '0 12 * * 1'  # Segunda-feira às 12h (Brasília - UTC-3)
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    name: Gerar Relatório de Progresso
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Gerar métricas de progresso
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Converter para timezone de Brasília (UTC-3)
            const now = new Date();
            const brasiliaTz = new Date(now.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }));
            const date = brasiliaTz.toISOString().split('T')[0];
            
            // Obter estatísticas de issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            const openIssues = issues.data.filter(i => i.state === 'open' && !i.pull_request).length;
            const closedIssues = issues.data.filter(i => i.state === 'closed' && !i.pull_request).length;
            const totalIssues = openIssues + closedIssues;
            const completionRate = totalIssues > 0 ? ((closedIssues / totalIssues) * 100).toFixed(2) : 0;
            
            // Obter estatísticas de PRs
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            const openPRs = prs.data.filter(p => p.state === 'open').length;
            const mergedPRs = prs.data.filter(p => p.merged_at).length;
            const totalPRs = openPRs + mergedPRs;
            
            // Gerar relatório
            const report = `# Progress Report - ${date}

## 📊 Issues
- **Open**: ${openIssues}
- **Closed**: ${closedIssues}
- **Total**: ${totalIssues}
- **Completion Rate**: ${completionRate}%

## 🔀 Pull Requests
- **Open**: ${openPRs}
- **Merged**: ${mergedPRs}
- **Total**: ${totalPRs}

## 📈 Velocity
- **Issues Closed This Week**: ${closedIssues}
- **PRs Merged This Week**: ${mergedPRs}

## 🎯 Milestones
`;
            
            // Obter milestones
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all'
            });
            
            for (const milestone of milestones.data) {
              const progress = milestone.closed_issues + milestone.open_issues > 0 
                ? ((milestone.closed_issues / (milestone.closed_issues + milestone.open_issues)) * 100).toFixed(2)
                : 0;
              
              report += `\n### ${milestone.title}
- **Progress**: ${progress}%
- **Closed**: ${milestone.closed_issues}
- **Open**: ${milestone.open_issues}
`;
            }
            
            // Salvar relatório
            const reportPath = `.kiro/reports/progress-${date}.md`;
            fs.mkdirSync('.kiro/reports', { recursive: true });
            fs.writeFileSync(reportPath, report);
            
            console.log('Progress report generated:', reportPath);
      
      - name: Fazer commit do relatório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .kiro/reports/progress-*.md
          git commit -m "docs: adiciona relatório de progresso" || true
          git push
