name: CI - Lint & Tests

on:
  push:
    branches: [ feature/*, bugfix/*, hotfix/* ]
    paths-ignore:
      - 'docs/**'
      - '.kiro/steering/**'
      - '.github/issue_template/**'
      - '*.md'
  pull_request:
    branches: [ develop, main ]
    paths-ignore:
      - 'docs/**'
      - '.kiro/steering/**'
      - '.github/issue_template/**'
      - '*.md'

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    name: Backend - Lint (flake8)
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          cd backend && pip install -r requirements.txt
      
      - name: Lint with flake8
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check formatting with black
        run: |
          cd backend
          black --check . || true
      
      - name: Check import sorting with isort
        run: |
          cd backend
          isort --check-only . || true

  backend-tests:
    runs-on: ubuntu-latest
    name: Backend - Unit Tests (pytest)
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biotech_user
          POSTGRES_PASSWORD: biotech_password
          POSTGRES_DB: biotecpredict
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run pytest with coverage
        run: |
          cd backend
          pytest tests/pytest/ --cov=. --cov-report=xml --cov-report=html -v
        env:
          DATABASE_URL: postgresql://biotech_user:biotech_password@localhost:5432/biotecpredict
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  frontend-lint:
    runs-on: ubuntu-latest
    name: Frontend - Lint (ESLint)
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint || true

  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend - Unit Tests (Vitest)
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run Vitest with coverage
        run: |
          cd frontend
          npm run test:coverage || npm run test
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  api-integration-tests:
    runs-on: ubuntu-latest
    name: API - Integration Tests (Postman/Newman)
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biotech_user
          POSTGRES_PASSWORD: biotech_password
          POSTGRES_DB: biotecpredict
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements.txt
      
      - name: Start FastAPI server
        run: |
          cd backend
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql://biotech_user:biotech_password@localhost:5432/biotecpredict
      
      - name: Set up Node.js for Newman
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Newman
        run: npm install -g newman
      
      - name: Run Postman collection tests
        run: |
          newman run backend/tests/postman/BiotecPredict.postman_collection.json \
            --environment backend/tests/postman/BiotecPredict.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export postman-results.json || true

  build-status:
    runs-on: ubuntu-latest
    name: Build Status Check
    needs: [backend-lint, backend-tests, frontend-lint, frontend-tests, api-integration-tests]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.backend-lint.result }}" = "failure" ] || \
             [ "${{ needs.backend-tests.result }}" = "failure" ] || \
             [ "${{ needs.frontend-lint.result }}" = "failure" ] || \
             [ "${{ needs.frontend-tests.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi
