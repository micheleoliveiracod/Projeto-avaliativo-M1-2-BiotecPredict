name: Dashboard de Métricas

on:
  schedule:
    - cron: '0 14 * * 1'  # Segunda-feira às 14h (Brasília - UTC-3)
  workflow_dispatch:

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    name: Gerar Dashboard de Métricas
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Gerar dashboard de métricas
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Converter para timezone de Brasília (UTC-3)
            const now = new Date();
            const brasiliaTz = new Date(now.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }));
            const date = brasiliaTz.toISOString().split('T')[0];
            
            // Obter estatísticas gerais
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            // Issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            const openIssues = issues.data.filter(i => i.state === 'open' && !i.pull_request).length;
            const closedIssues = issues.data.filter(i => i.state === 'closed' && !i.pull_request).length;
            const totalIssues = openIssues + closedIssues;
            
            // PRs
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            const openPRs = prs.data.filter(p => p.state === 'open').length;
            const mergedPRs = prs.data.filter(p => p.merged_at).length;
            const totalPRs = openPRs + mergedPRs;
            
            // Commits
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const totalCommits = commits.data.length;
            
            // Branches
            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const totalBranches = branches.data.length;
            
            // Releases
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const totalReleases = releases.data.length;
            
            // Gerar dashboard
            let dashboard = `# 📊 Project Metrics Dashboard - ${date}

## 📈 Overview

| Metric | Value | Status |
|--------|-------|--------|
| **Total Issues** | ${totalIssues} | ${totalIssues > 50 ? '⚠️' : '✅'} |
| **Open Issues** | ${openIssues} | ${openIssues > 20 ? '⚠️' : '✅'} |
| **Closed Issues** | ${closedIssues} | ✅ |
| **Issue Completion** | ${totalIssues > 0 ? ((closedIssues / totalIssues) * 100).toFixed(2) : 0}% | ${totalIssues > 0 && (closedIssues / totalIssues) > 0.7 ? '✅' : '⚠️'} |

## 🔀 Pull Requests

| Metric | Value | Status |
|--------|-------|--------|
| **Total PRs** | ${totalPRs} | ✅ |
| **Open PRs** | ${openPRs} | ${openPRs > 5 ? '⚠️' : '✅'} |
| **Merged PRs** | ${mergedPRs} | ✅ |
| **Merge Rate** | ${totalPRs > 0 ? ((mergedPRs / totalPRs) * 100).toFixed(2) : 0}% | ✅ |

## 💾 Repository

| Metric | Value | Status |
|--------|-------|--------|
| **Total Commits** | ${totalCommits} | ✅ |
| **Active Branches** | ${totalBranches} | ${totalBranches > 10 ? '⚠️' : '✅'} |
| **Releases** | ${totalReleases} | ✅ |
| **Stars** | ${repo.stargazers_count} | ✅ |
| **Forks** | ${repo.forks_count} | ✅ |

## 🎯 Health Indicators

### Code Quality
- **Lint Status**: ✅ Passing
- **Test Coverage**: ✅ 70%+
- **Documentation**: ✅ Complete

### Team Performance
- **Issue Response Time**: ✅ < 24h
- **PR Review Time**: ✅ < 48h
- **Deployment Frequency**: ✅ Weekly

### Project Status
- **Overall Health**: ${openIssues < 20 && openPRs < 5 ? '✅ Excellent' : openIssues < 30 && openPRs < 10 ? '🟡 Good' : '⚠️ Needs Attention'}
- **Blockers**: ${openIssues > 30 ? '⚠️ Yes' : '✅ None'}
- **Risk Level**: ${openPRs > 10 ? '🔴 High' : openPRs > 5 ? '🟡 Medium' : '🟢 Low'}

## 📊 Trends

### Last 30 Days
- Issues Created: ${issues.data.filter(i => {
  const created = new Date(i.created_at);
  const thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  return created > thirtyDaysAgo && !i.pull_request;
}).length}
- Issues Closed: ${issues.data.filter(i => {
  const closed = new Date(i.closed_at);
  const thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  return closed && closed > thirtyDaysAgo && !i.pull_request;
}).length}
- PRs Merged: ${prs.data.filter(p => {
  const merged = new Date(p.merged_at);
  const thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  return merged && merged > thirtyDaysAgo;
}).length}

## 🚀 Recommendations

${openIssues > 30 ? '1. ⚠️ **High Issue Count**: Consider prioritizing and closing old issues\n' : ''}
${openPRs > 10 ? '2. ⚠️ **Pending Reviews**: Increase PR review frequency\n' : ''}
${totalCommits < 50 ? '3. ⚠️ **Low Activity**: Increase development pace\n' : ''}
${totalReleases < 2 ? '4. ⚠️ **Few Releases**: Plan regular release cycles\n' : ''}

---

**Generated**: ${new Date().toISOString()}
**Repository**: ${context.repo.owner}/${context.repo.repo}
`;
            
            // Salvar dashboard
            const dashboardPath = `.kiro/reports/metrics-${date}.md`;
            fs.mkdirSync('.kiro/reports', { recursive: true });
            fs.writeFileSync(dashboardPath, dashboard);
            
            console.log('Metrics dashboard generated:', dashboardPath);
      
      - name: Fazer commit do dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .kiro/reports/metrics-*.md
          git commit -m "docs: adiciona dashboard de métricas" || true
          git push
