name: Create Delivery Checklist

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-delivery-checklist.yml'

jobs:
  create-checklist:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Master Checklist Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read current implementation status
            let implementationStatus = '';
            try {
              implementationStatus = fs.readFileSync('IMPLEMENTATION_STATUS.md', 'utf8');
            } catch (e) {
              implementationStatus = 'Arquivo não encontrado';
            }

            const checklist = `# 📋 Master Checklist - Entrega Final

**Data de Criação**: ${new Date().toLocaleDateString('pt-BR')}  
**Status**: Em Progresso  
**Progresso**: 0/50 itens completos

---

## 🎯 Objetivo

Esta é a **Master Checklist Issue** - um rastreador central de todos os requisitos de entrega do projeto avaliativo BiotecPredict. Permanece aberta durante todo o projeto e consolida:

- ✅ Requisitos de funcionalidade
- ✅ Requisitos de qualidade (testes, documentação)
- ✅ Requisitos de processo (GitFlow, CI/CD)
- ✅ Requisitos de IA (prompts, análise crítica)
- ✅ Critérios de avaliação (15 critérios)

---

## 📊 Resumo de Implementação Atual

\`\`\`
${implementationStatus.substring(0, 500)}...
\`\`\`

**Leia o arquivo completo**: [IMPLEMENTATION_STATUS.md](../IMPLEMENTATION_STATUS.md)

---

## 1️⃣ Apresentação (Video Delivery)

- [ ] Vídeo de apresentação gravado (máx 10 min)
- [ ] Demonstração de funcionalidades principais (upload, compliance, ML)
- [ ] Explicação de arquitetura e decisões técnicas
- [ ] Análise crítica de uso de IA no projeto
- [ ] Vídeo hospedado (YouTube, Vimeo, ou GitHub)
- [ ] Link do vídeo adicionado ao README

**Evidência**: Link do vídeo no README.md

---

## 2️⃣ Uso do GitHub Board (Kanban)

- [ ] Board "BiotecPredict Roadmap" criado
- [ ] 6 colunas configuradas: Backlog, Sprint Ready, In Progress, Review, Done, Blocked
- [ ] Issues adicionadas ao board automaticamente (via workflow)
- [ ] Movimento automático de issues conforme status
- [ ] Milestones sincronizados com sprints
- [ ] Relatórios de progresso gerados semanalmente

**Evidência**: Board visível em GitHub Projects

---

## 3️⃣ Uso do Repositório GitHub

- [ ] Branches seguem GitFlow (main, develop, feature/*, bugfix/*, hotfix/*)
- [ ] Commits seguem Conventional Commits (feat, fix, docs, chore, etc)
- [ ] Pull requests com templates preenchidos
- [ ] Mínimo 1 aprovação antes de merge
- [ ] Histórico limpo e rastreável
- [ ] Tags de versão criadas (v0.0.1-alpha, v0.1.0, etc)
- [ ] Squash merge para features, merge commit para releases

**Evidência**: Histórico de commits e branches no GitHub

---

