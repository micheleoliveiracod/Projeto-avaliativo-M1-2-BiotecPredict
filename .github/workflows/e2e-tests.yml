name: E2E Tests - Cypress

# DESABILITADO PARA FASE 0 - Será ativado em Sprint 2 (frontend-e2e-tests) e Sprint 4 (cypress-e2e-tests)
# Este workflow NÃO deve rodar em Fase 0 (Sprint 0)
# Configurado para rodar APENAS manualmente via workflow_dispatch
on:
  workflow_dispatch:  # Apenas manual para testes
  schedule:
    - cron: '0 2 * * 0'  # Nunca roda (domingo às 2 AM UTC)

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests (Cypress)
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements.txt
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Start backend server
        run: |
          cd backend
          python -m uvicorn main:app --host 0.0.0.0 --port 8001 &
          sleep 5
        env:
          DATABASE_URL: sqlite:///./Biotecpredict.db
      
      - name: Start frontend dev server
        run: |
          cd frontend
          npm run dev &
          sleep 10
      
      - name: Run Cypress E2E tests
        run: |
          cd frontend
          npm run test:e2e
      
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
      
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-videos
          path: frontend/cypress/videos
