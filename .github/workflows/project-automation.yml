name: Project Automation

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, closed, converted_to_draft, ready_for_review]

jobs:
  add-to-project:
    name: Add Issue/PR to Project
    runs-on: ubuntu-latest
    steps:
      - name: Add to project using REST API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const item = context.payload.pull_request || context.payload.issue;
            
            if (!item) {
              console.log('❌ Nenhuma PR ou issue encontrada');
              return;
            }
            
            console.log(`📌 Processando: ${item.number} (${item.title})`);
            
            try {
              // Buscar todos os projetos do usuário
              const projectsResponse = await github.rest.projects.listForUser({
                username: owner,
                state: 'open'
              });
              
              console.log(`📊 Projetos encontrados: ${projectsResponse.data.length}`);
              
              // Procurar pelo projeto BiotecPredict
              const project = projectsResponse.data.find(p => 
                p.name === 'BiotecPredict' || p.number === 7
              );
              
              if (!project) {
                console.log('❌ Projeto BiotecPredict não encontrado');
                console.log('Projetos disponíveis:', projectsResponse.data.map(p => `${p.name} (#${p.number})`).join(', '));
                return;
              }
              
              console.log(`✅ Projeto encontrado: ${project.name} (ID: ${project.id})`);
              
              // Criar card no projeto
              const cardResponse = await github.rest.projects.createCard({
                column_id: project.columns_url.split('/').pop(), // Usar primeira coluna
                note: `${item.title}\n\n${item.html_url}`
              });
              
              console.log(`✅ Card criado com sucesso: ${cardResponse.data.id}`);
              
            } catch (error) {
              console.log(`⚠️ Erro ao adicionar ao projeto: ${error.message}`);
              
              // Tentar abordagem alternativa com GraphQL
              console.log('🔄 Tentando abordagem alternativa com GraphQL...');
              
              try {
                const query = `
                  query {
                    user(login: "${owner}") {
                      projectsV2(first: 10) {
                        nodes {
                          id
                          number
                          title
                        }
                      }
                    }
                  }
                `;
                
                const result = await github.graphql(query);
                const projectV2 = result.user.projectsV2.nodes.find(p => p.number === 7);
                
                if (projectV2) {
                  console.log(`✅ ProjectV2 encontrado: ${projectV2.title} (ID: ${projectV2.id})`);
                  
                  const addItemMutation = `
                    mutation {
                      addProjectV2ItemById(input: {projectId: "${projectV2.id}", contentId: "${item.node_id}"}) {
                        item {
                          id
                        }
                      }
                    }
                  `;
                  
                  const addResult = await github.graphql(addItemMutation);
                  console.log(`✅ Item adicionado ao projeto: ${item.number}`);
                } else {
                  console.log('❌ ProjectV2 #7 não encontrado');
                }
              } catch (graphqlError) {
                console.log(`❌ Erro na abordagem alternativa: ${graphqlError.message}`);
              }
            }

  update-project-status:
    name: Update Project Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Update status based on PR state
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            if (pr) {
              console.log(`📋 PR #${pr.number}: ${pr.state}`);
              if (pr.state === 'open' && pr.draft === false) {
                console.log('✅ PR está pronta para revisão');
              } else if (pr.draft) {
                console.log('📝 PR está em rascunho');
              }
            }

  sync-milestones:
    name: Sync Milestones with Project
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    steps:
      - name: Sync milestone
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const item = context.payload.pull_request || context.payload.issue;
            
            if (item && item.milestone) {
              console.log(`✅ Sincronizando milestone: ${item.milestone.title}`);
            } else {
              console.log(`ℹ️ Nenhum milestone associado`);
            }
