name: Project Automation

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, closed, converted_to_draft, ready_for_review]

jobs:
  add-to-project:
    name: Add Issue/PR to Project
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/micheleoliveiracod/projects/7
          github-token: ${{ secrets.GITHUB_TOKEN }}

  update-project-status:
    name: Update Project Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Update status based on PR state
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const issue = context.payload.issue;
            
            if (pr) {
              console.log(`PR #${pr.number}: ${pr.state}`);
              if (pr.state === 'open' && pr.draft === false) {
                console.log('PR is ready for review');
              }
            }
            
            if (issue) {
              console.log(`Issue #${issue.number}: ${issue.state}`);
            }

  sync-milestones:
    name: Sync Milestones with Project
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    steps:
      - name: Sync milestone
        uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.pull_request || context.payload.issue;
            
            if (item && item.milestone) {
              console.log(`Syncing milestone: ${item.milestone.title}`);
            }
