name: Project Automation

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, closed, converted_to_draft, ready_for_review]

jobs:
  add-to-project:
    name: Add Issue/PR to Project
    runs-on: ubuntu-latest
    steps:
      - name: Add to project using GraphQL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
              query {
                user(login: "micheleoliveiracod") {
                  projectV2(number: 7) {
                    id
                  }
                }
              }
            `;
            
            const result = await github.graphql(query);
            const projectId = result.user.projectV2.id;
            
            console.log(`Project ID: ${projectId}`);
            
            const item = context.payload.pull_request || context.payload.issue;
            
            if (item) {
              const addItemMutation = `
                mutation {
                  addProjectV2ItemById(input: {projectId: "${projectId}", contentId: "${item.node_id}"}) {
                    item {
                      id
                    }
                  }
                }
              `;
              
              try {
                const addResult = await github.graphql(addItemMutation);
                console.log(`✅ Item adicionado ao projeto: ${item.number}`);
              } catch (error) {
                console.log(`⚠️ Item já existe no projeto ou erro: ${error.message}`);
              }
            }

  update-project-status:
    name: Update Project Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Update status based on PR state
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
              query {
                user(login: "micheleoliveiracod") {
                  projectV2(number: 7) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const result = await github.graphql(query);
            const projectId = result.user.projectV2.id;
            const statusField = result.user.projectV2.fields.nodes.find(f => f.name === 'Status');
            
            if (statusField) {
              console.log(`✅ Campo Status encontrado: ${statusField.id}`);
              
              const pr = context.payload.pull_request;
              if (pr) {
                console.log(`PR #${pr.number}: ${pr.state}`);
                if (pr.state === 'open' && pr.draft === false) {
                  console.log('✅ PR está pronta para revisão');
                }
              }
            }

  sync-milestones:
    name: Sync Milestones with Project
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    steps:
      - name: Sync milestone
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const item = context.payload.pull_request || context.payload.issue;
            
            if (item && item.milestone) {
              console.log(`✅ Sincronizando milestone: ${item.milestone.title}`);
            } else {
              console.log(`ℹ️ Nenhum milestone associado`);
            }
